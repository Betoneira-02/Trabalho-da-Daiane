<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trabalho da Daiane</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #350a06;
                color: #ffffff; 
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 40px 16px;
                background-repeat: no-repeat;
                background-size: cover;
            }
            .resultado {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 90%;
                max-width: 400px;
                margin: 20px auto;
            }
            .botao {
                display: flex;
                flex-direction: row;
                gap: 20px;
                justify-content: center;
                border: 1px solid greenyellow;
                border-radius: 40px;
                box-shadow: 0 5px 8px greenyellow;
                background-color: rgba(255, 255, 255, 0.1);
                padding: 20px;
                width: 90%;
                max-width: 400px;
                margin: 40px auto 0 auto;
            }
            input {
                border-radius: 50px;
                border: 2px solid purple;
                font-size: 20px;
                width: 80%;
                max-width: 300px;
                padding: 10px;
                margin: 6px;
                text-align: center;
            }
            button {
                background-color: orange;
                border: 2px dotted black;
                border-radius: 50px;
                font-size: 18px;
                padding: 10px 20px;
                cursor: pointer;
                transition: background-color 0.3s ease;
                margin: 6px;
            }
            button:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }
            @media (max-width: 600px) {
                h1 {
                    font-size: 22px;
                }
                .botao {
                    flex-direction: column;
                    gap: 10px;
                }
                input {
                    font-size: 18px;
                }
                button {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <h1 id="batata">Bem-vindo ao teste.</h1>
        
        <div class="resultado">
            <input type="number" id="palpite" placeholder="Digite seu palpite">
            
            <button id="enviar" onclick="verificarPalpite()" disabled>
                Enviar palpite
            </button>
            
            <p id="mensagem">Clique em "Start" para começar.</p>
            <p id="tentativas"></p>
        </div>
        
        <div class="botao">
            <p>Escolha um número conforme sua dificuldade.</p>
            <button onclick="start()">Start</button>
            <button onclick="reset()">Reset</button>
        </div>

        <script>
            const dificuldade = {
                Basico: { limite: 10 },
                Medio: { limite: 50 },
                Difícil: { limite: 100 },
                Avancado: { limite: 500 }
            };

            const nivelSelecionado = localStorage.getItem("nivel") || "Basico";
            const nomeUser = localStorage.getItem("nomeUser") || "Usuário";

            let numeroSecreto = 0;
            let tentativasRestantes = 0;
            let jogoAtivo = false;

            function start() {
                jogoAtivo = true;
                
                const config = dificuldade[nivelSelecionado] || dificuldade.Basico;
                numeroSecreto = Math.floor(Math.random() * config.limite) + 1;
                
                tentativasRestantes = 4;

                document.getElementById("batata").innerText = `Olá, ${nomeUser}! Nível: ${nivelSelecionado}`;
                document.getElementById("mensagem").innerText = `Adivinhe um número de 1 a ${config.limite}.`;
                document.getElementById("tentativas").innerText = `Tentativas restantes: ${tentativasRestantes}`;
                
                document.getElementById("enviar").disabled = false;
                document.getElementById("palpite").value = "";
                document.getElementById("palpite").focus();
            }

            function verificarPalpite() {
                if (!jogoAtivo) return;

                const inputPalpite = document.getElementById("palpite");
                const palpiteValor = parseInt(inputPalpite.value);
                const mensagem = document.getElementById("mensagem");
                const txtTentativas = document.getElementById("tentativas");

                if (isNaN(palpiteValor)) {
                    alert("Por favor, digite um número válido!");
                    return;
                }

                tentativasRestantes--;

                if (palpiteValor === numeroSecreto) {
                    mensagem.innerText = `🎉 Parabéns, ${nomeUser}! Você acertou o número ${numeroSecreto}!`;
                    encerrarJogo();
                } else if (tentativasRestantes === 0) {
                    mensagem.innerText = `😢 Game Over! O número secreto era ${numeroSecreto}.`;
                    encerrarJogo();
                } else if (palpiteValor < numeroSecreto) {
                    mensagem.innerText = "📈 O número secreto é **maior**!";
                    txtTentativas.innerText = `Tentativas restantes: ${tentativasRestantes}`;
                } else {
                    mensagem.innerText = "📉 O número secreto é **menor**!";
                    txtTentativas.innerText = `Tentativas restantes: ${tentativasRestantes}`;
                }

                inputPalpite.value = "";
                inputPalpite.focus();
            }

            function encerrarJogo() {
                jogoAtivo = false;
                document.getElementById("enviar").disabled = true;
                document.getElementById("tentativas").innerText = "Fim de jogo. Clique em 'Reset' para jogar novamente.";
            }

            function reset() {
                window.location.reload();
            }
        </script>
    </body>
</html>
