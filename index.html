<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cumprimento de Metas nas Plataformas.</h1>
            <p>Selecione a plataforma e digite sua dúvida para receber uma dica.</p>
        </header>
        <main class="card">
            <div class="form-group">
                <label for="plataforma">Escolha a Plataforma:</label>
                <select id="plataforma">
                    <option value="">-- Selecione --</option>
                    <option value="leia">Leia Paraná</option>
                    <option value="redacao">Redação Paraná</option>
                    <option value="ingles">Inglês Paraná</option>
                </select>
            </div>
            <div class="form-group">
                <label for="duvida">Qual é a sua dúvida ou questão?</label>
                <textarea id="duvida" rows="4" placeholder="Descreva brevemente o que você precisa resolver..."></textarea>
            </div>
            <button id="btnEnviar">Pedir Dica</button>
            <div id="resultado" class="hidden">
                <h3>Orientação:</h3>
                <div id="conteudoResposta"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
