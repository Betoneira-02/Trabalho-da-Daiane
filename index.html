<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas das Plataformas - Paraná</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tela 1: Escolha da Plataforma -->
        <div id="category-screen" class="screen">
            <h1>Cumprimento de Metas</h1>
            <p>Selecione a plataforma educacional:</p>
            <button onclick="selectCategory('Leia Paraná')">📖 Leia Paraná</button>
            <button onclick="selectCategory('Redação Paraná')">✍️ Redação Paraná</button>
            <button onclick="selectCategory('Inglês Paraná')">🗣️ Inglês Paraná</button>
        </div>

        <!-- Tela 2: Escolha de Nível/Etapa -->
        <div id="difficulty-screen" class="screen" style="display:none;">
            <h2>Escolha a Categoria / Nível</h2>
            <div id="difficulty-buttons">
                <!-- Os botões entram dinamicamente aqui via script.js -->
            </div>
        </div>

        <!-- Tela 3: Perguntas do Quiz -->
        <div id="quiz-screen" class="screen" style="display:none;">
            <span id="progress-indicator" class="progress"></span>
            <h3 id="question-text">Carregando pergunta...</h3>
            <div id="options-container"></div>
        </div>

        <!-- Tela 4: Resultados -->
        <div id="result-screen" class="screen" style="display:none;">
            <h2>Resultado do Desempenho</h2>
            <p id="result-text"></p>
            <button onclick="goToScreen('category-screen')">Escolher Outra Plataforma</button>
        </div>
    </div>

    <!-- Script único -->
    <script src="script.js"></script>
</body>
</html>
