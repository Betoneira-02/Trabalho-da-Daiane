<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Desafios com Quiz Aleatório</title>
</head>
<body>
    <div class="container">
        <div class="user-stats">
            <span id="stat-level">Nível: 1 (Iniciante)</span>
            <span id="stat-xp">XP: 0 pts</span>
        </div>
        <div id="screen-home" class="screen active">
            <h1>Desafios Aleatórios</h1>
            <h2>Escolha sua categoria de estudo:</h2>
            <div class="btn-group">
                <button onclick="selectCategory('Leia')">Leia </button>
                <button onclick="selectCategory('Redação')">Redação </button>
                <button onclick="selectCategory('Inglês')">Inglês </button>
            </div>
        </div>
        <div id="screen-difficulty" class="screen">
            <h1 id="diff-title">Categoria</h1>
            <h2>Escolha dentre as seguintes dificuldades:</h2>
            <div class="btn-group">
                <button onclick="selectDifficulty('Fácil')">Fácil <span style="font-size:0.8rem; opacity:0.8;">(+15 XP)</span></button>
                <button onclick="selectDifficulty('Médio')">Médio <span style="font-size:0.8rem; opacity:0.8;">(+30 XP)</span></button>
                <button onclick="selectDifficulty('Difícil')">Difícil <span style="font-size:0.8rem; opacity:0.8;">(+60 XP)</span></button>
            </div>
            <button class="btn-secondary" onclick="goToScreen('screen-home')">Voltar</button>
        </div>
        <div id="screen-challenge" class="screen">
            <div id="reward-tag" class="reward-badge">Recompensa: 15 XP</div>
            <h1 id="challenge-header">Desafio</h1>
            <h2>Responda às 3 questões geradas:</h2
            <div id="questions-container">
            </div>

            <div class="btn-group">
                <button id="btn-finish" style="display:none;" onclick="finishChallenge()">Ver Resultado</button>
                <button class="btn-secondary" onclick="goToScreen('screen-home')">Abandonar</button>
            </div>
        </div>
        <div id="screen-success" class="screen">
            <h1>🎉 Desafio Concluído!</h1>
            <h2>Você acertou <span id="correct-count">0</span> de 3 questões!</h2>
            <div class="question-box" style="text-align: center;">
                <p id="result-message">Parabéns pelo esforço!</p>
            </div>
            <div class="btn-group">
                <button onclick="goToScreen('screen-home')">Jogar Novamente</button>
            </div>
        </div>
    </div>
</body>
</html>
